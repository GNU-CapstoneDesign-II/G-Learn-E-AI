name: CI/CD - AI
on:
  push: { branches: [ "main" ] }
  workflow_dispatch:

jobs:
  build-push:
    uses: <ORG>/.github/.github/workflows/build-push.yml@main
    with:
      image_name: ${{ secrets.DOCKERHUB_USERNAME }}/g-learn-e-ai
      context: .
      dockerfile: ./DockerFile
    secrets: inherit

  deploy:
    needs: build-push
    uses: <ORG>/.github/.github/workflows/deploy-stack.yml@main
    with:
      image_app_ai: ${{ secrets.DOCKERHUB_USERNAME }}/g-learn-e-ai
      image_app_be: ${{ secrets.DOCKERHUB_USERNAME }}/g-learn-e-be
      stack_dir: $HOME/stack
    secrets: inherit
